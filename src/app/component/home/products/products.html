@if(productStore.products().length === 0) {
  <!-- No products found - full width centered message -->
  <div class="flex justify-center items-center gap-x-4 flex-row w-full mt-20  text-gray-500">
    <fa-icon [icon]="faBoxOpen" class="text-[60px] "></fa-icon>
    <p class="text-2xl font-medium">No Product Found</p>
  </div>
}@else {
  
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 px-4 py-6">
  @for (product of productStore.products(); track product.id) {
      <div class="bg-white border border-gray-200 rounded-lg shadow-md hover:shadow-lg transition duration-300">
        <!-- Fixed aspect ratio container -->
        <div class="aspect-[3/4] overflow-hidden rounded-t-lg bg-gray-100 flex items-center justify-center">
          @defer(on viewport) {
            <a routerLink ='/home/product/{{product.id}}'>
            <img
              class="object-cover w-60 transition-transform duration-300 hover:scale-105"
              [src]="'../../../../assets/images/' + product.product_image"
              [alt]="product.product_name"
            />
           </a>

          } @placeholder {
            <p>loading images...</p>
          }
        </div>
        <div class="p-4 text-center">
          <h3 class="text-lg font-semibold text-gray-800 truncate">
            <a  routerLink ='/home/product/{{product.id}}' class="hover:text-blue-600">{{ product.product_name }}</a>
          </h3>
          <p class="text-sm text-gray-500 mt-1">${{ product.price }}</p>
          <app-ratings [score]="product.ratings"></app-ratings>
          <button class="flex items-center justify-center gap-2 mt-4 w-full py-2 text-white bg-black rounded-lg cursor-pointer hover:bg-gray-800 transition-colors"
          (click)="addToCart(product)"
          >
          <fa-icon [icon]="faShoppingCart"></fa-icon>
          <span>Add to Cart</span>
          </button>
        </div>
      </div>
    }
  </div>
  }
