<div class="bg-gray-800 border-t border-gray-500">
    <ul class="flex ">
        <li class="list-none mx-4 py-2 h-10 relative group"><a
            class="text-sm font-bold text-white relative no-underline" href="javascript: void(i)">Home<span
            class=" absolute bg-red-500 h-[2px] w-0 left-0 bottom-0 transition-all group-hover:w-full"></span></a>
        </li>
        
        @for(category of categoryStore.topLevelCategories(); track category.id){
            <li class=" list-none mx-4 py-2 h-10 relative"><a
                    class="text-white font-bold text-sm no-underline relative group" href="#">{{category.category}}<span
                        class="absolute left-0 bottom-0  h-[2px] w-0 bg-red-500 transition-all group-hover:w-full"></span></a></li>
                    }
                    </ul>
</div>
